name: Keep alive

# Consulta /health cada 10 minutos para que Render (plan gratis) no duerma el
# servicio y Supabase (plan gratis) no pause la base de datos por inactividad.
# Si algun dia se pasa a hosting/base de datos de pago, este archivo se puede borrar.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --retry 3 --retry-delay 15 --max-time 90 https://courier-cr-bot.onrender.com/health
